name: Build & deploy web/

# web/ at /mesonet-dashboard/ (the Caddy proxy also serves it as
# mesonet.climate.umt.edu/dash/next/, the install address). Pages serves only
# the root 404.html (web/public/404.html), which routes <root>/<station> deep
# links and old /mesonet-dashboard/next/ links.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# Let an in-flight deployment finish; queue the next one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test

      - name: Build
        run: |
          npm run build
          npm run size

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
