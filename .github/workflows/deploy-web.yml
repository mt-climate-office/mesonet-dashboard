name: Build & deploy web/

# One Pages artifact: web/ at /mesonet-dashboard/ and the web-next/ preview
# at /mesonet-dashboard/next/ (Pages serves only the root 404.html, which
# routes /next/<station> deep links into web-next).
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'web-next/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# Let an in-flight deployment finish; queue the next one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web-next/package-lock.json

      - name: web/ — check + build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test --if-present
          npm run build

      - name: web-next/ — check + build (base /mesonet-dashboard/next/)
        working-directory: web-next
        env:
          VITE_BASE: /mesonet-dashboard/next/
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run size

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -R web/dist/. site/
          mkdir -p site/next
          cp -R web-next/dist/. site/next/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
