# PR gate for web/ (the dashboard: Alpine + ECharts): typecheck, lint,
# unit tests, production build and the bundle-size budget; then `verify`:
# kit-consumer checks, the axe matrix, keyboard walkthroughs and phone
# layout / touch / motion checks in Chromium
# against the built app, with API data from web/scripts/verify/fixtures.
name: Check web/

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-check.yml'

concurrency:
  group: web-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run size

  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
