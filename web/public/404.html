<!doctype html>
<!-- GitHub Pages serves this (status 404) for any path with no file. It sends `<root>/<station>` to
     `<root>/?s=<station>` (deep links from the legacy app) and anything else to `<root>/`, keeping
     query and hash. `<root>` is the Pages project (`/mesonet-dashboard`), or `/dash/next` behind the
     Caddy proxy on mesonet.climate.umt.edu. Links to the retired `/mesonet-dashboard/next/` copy land
     on the root. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Montana Mesonet Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var path = window.location.pathname
        var proxied = path === '/dash/next' || path.indexOf('/dash/next/') === 0
        var root = proxied ? '/dash/next' : '/' + (path.split('/')[1] || '')
        var rest = path.slice(root.length + 1)
        if (!proxied) rest = rest.replace(/^next(\/|$)/, '')
        var sub = rest.replace(/\/+$/, '')
        var search = window.location.search
        if (sub && /^[a-z0-9_-]+$/i.test(sub) && !/(^\?|&)s=/.test(search)) {
          search = search ? search + '&s=' + sub : '?s=' + sub
        }
        window.location.replace(root + '/' + search + window.location.hash)
      })()
    </script>
  </head>
  <body>
    <noscript>
      JavaScript is required to load the Montana Mesonet Dashboard. Please enable it or visit the
      <a href="https://mesonet.climate.umt.edu/dash/">legacy dashboard</a>.
    </noscript>
  </body>
</html>
