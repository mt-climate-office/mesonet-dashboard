<!doctype html>
<!-- GitHub Pages serves this (status 404) for any path with no file. It sends `<base>/<station>` to
     `<base>/?s=<station>` (deep links from the legacy app) and anything else under the site to its
     index, keeping query and hash. Two builds share the site: the root and `/next/` (the proxy's), so
     a path under `<base>/next/` stays there. `<base>` is the first path segment (the Pages project). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Montana Mesonet Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var path = window.location.pathname
        var base = '/' + (path.split('/')[1] || '')
        var root = path === base + '/next' || path.indexOf(base + '/next/') === 0 ? base + '/next' : base
        var sub = path.slice(root.length + 1).replace(/\/+$/, '')
        var search = window.location.search
        if (sub && /^[a-z0-9_-]+$/i.test(sub) && !/(^\?|&)s=/.test(search)) {
          search = search ? search + '&s=' + sub : '?s=' + sub
        }
        window.location.replace(root + '/' + search + window.location.hash)
      })()
    </script>
  </head>
  <body>
    <noscript>
      JavaScript is required to load the Montana Mesonet Dashboard. Please enable it or visit the
      <a href="https://mesonet.climate.umt.edu/dash/">legacy dashboard</a>.
    </noscript>
  </body>
</html>
