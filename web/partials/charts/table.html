<!-- A chart shown as a table (tbl=1): the body of x-data="chartTable({ table: () => … })"
     (ui/charts/chartTable.ts), which the including page puts on the wrapper. A real <table> in a
     focusable, labelled scroll region (it scrolls sideways inside itself, never the page),
     newest rows first, Newer / Older (a fixed-order table, the wind rose, as it is, unpaged). Above it, Show as chart: the same action as the page's
     ⋮ → Show as chart (the including page's toggleTable(): variablePage or agTab). -->
<div class="var-table-bar">
  <button type="button" class="nav-btn" @click="toggleTable(); focusHeading()" data-testid="table-show-chart">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16M7 15l4-5 3 3 5-6"/></svg>
    Show as chart
  </button>
</div>
<template x-if="!table">
  <span class="dash-skel dash-skel--table" aria-hidden="true"></span>
</template>
<template x-if="table">
  <div>
    <div class="var-table-scroll" tabindex="0" role="region" :aria-label="table.caption" data-no-swipe>
      <table class="var-table-grid">
        <caption class="sr-only" x-text="caption"></caption>
        <thead><tr><template x-for="c in table.columns" :key="c"><th scope="col" x-text="c"></th></template></tr></thead>
        <tbody>
          <template x-for="(r, i) in view.rows" :key="i">
            <tr><template x-for="(cell, j) in r" :key="j"><td x-text="cell"></td></template></tr>
          </template>
        </tbody>
      </table>
    </div>
    <div class="var-pager">
      <button type="button" class="nav-btn" x-show="!table.fixedOrder" :disabled="view.page <= 1" @click="page = view.page - 1">Newer</button>
      <span role="status" x-text="view.summary"></span>
      <button type="button" class="nav-btn" x-show="!table.fixedOrder" :disabled="view.page >= view.pages" @click="page = view.page + 1">Older</button>
    </div>
  </div>
</template>
