
<!-- The station search (ui/picker/stationSearch.ts), in the picker (partials/picker.html) and the
     no-station landing (partials/landing.html); the host component gives `choose(id)` and
     `searchPlaceholder()`. The kit's place search (MCO.places.initPlaceSearch, on MCO.initSearchBox) owns
     the field's combobox ARIA and renders the listbox: stations, and places while typing. The "Near me"
     chip sits inside the field. Below it Near me's results (the chip closes the search list), or a picked
     place's stations, headed by the place ("Gallatin County", "Near Bozeman"). -->
<div class="ctl-combobox picker-search" data-testid="picker-search" x-id="['search-label', 'search-input']"
     x-init="$nextTick(() => searchInit($el))">
  <label class="ctl-label sr-only" :id="$id('search-label')" :for="$id('search-input')">Search stations and places</label>
  <div class="ctl-combobox-field">
    <svg class="picker-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input class="ctl-input" type="text" inputmode="search" enterkeyhint="search" data-autofocus
           :id="$id('search-input')" :placeholder="searchPlaceholder()">
    <button type="button" class="ctl-clear" x-show="query !== ''"
            aria-label="Clear Search stations and places" @click="clearSearch()">&times;</button>
    <button type="button" class="picker-near" x-show="geoSupported" @click="locate()"
            :disabled="near.status === 'locating'" data-testid="near-me"
            aria-label="Near me: list the closest stations (uses your location once, in this browser)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      <span>Near me</span>
    </button>
  </div>
  <div class="ctl-combobox-popup ctl-combobox-list" data-search-list :aria-labelledby="$id('search-label')" hidden></div>
</div>

<section class="picker-group" x-id="['near-title']" :aria-labelledby="$id('near-title')" x-show="near.status !== 'idle'" data-testid="near-results">
  <h3 class="picker-group-title" :id="$id('near-title')" x-text="near.title"></h3>
  <p class="picker-note" role="status" x-show="near.status === 'locating'">Finding your location…</p>
  <p class="picker-note" role="status" x-show="near.status === 'finding'">Finding stations…</p>
  <p class="picker-note" role="status" x-show="near.status === 'denied'" data-testid="near-denied">Location access is off for this site. Search by name or pick a station on the map.</p>
  <p class="picker-note" role="status" x-show="near.status === 'error'">Your location could not be found. Search by name or pick a station on the map.</p>
  <ul class="picker-list" x-show="near.status === 'ready'" data-testid="near-list">
    <template x-for="r in near.rows" :key="r.station">
      <li><button type="button" class="picker-row" @click="choose(r.station)" :aria-current="r.station === $store.station.id ? 'true' : null">
        <span class="picker-row-name" x-text="r.name"></span><span class="picker-row-meta" x-text="r.dist"></span>
      </button></li>
    </template>
  </ul>
</section>
