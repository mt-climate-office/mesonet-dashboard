<!-- Reference ET / feels-like / livestock risk (ui/ag/agMetView.ts): the chart card (notes, then the
     chart, its state, or its table with tbl=1) and the stats card (core/ag/view/stats metStats). -->
<div class="ag-view" x-data="agMetView" data-testid="ag-chart">
  <section class="dash-card ag-chart-card chart-card" :class="{ 'has-notes': view.notes.length > 0 }" aria-labelledby="ag-chart-title">
    <!-- @include partials/ag/status.html -->
    <template x-if="view.status === 'ready' && !tableMode() && kind() === 'etr'">
      <div class="chart ag-chart" data-testid="ag-chart-etr"
           x-data="chart({ ...charts.etr, model: () => modelOf('etr') })"></div>
    </template>
    <template x-if="view.status === 'ready' && !tableMode() && kind() === 'feels_like'">
      <div class="chart ag-chart" data-testid="ag-chart-feels_like"
           x-data="chart({ ...charts.feels_like, model: () => modelOf('feels_like') })"></div>
    </template>
    <template x-if="view.status === 'ready' && !tableMode() && kind() === 'cci'">
      <div class="chart ag-chart" data-testid="ag-chart-cci"
           x-data="chart({ ...charts.cci, model: () => modelOf('cci') })"></div>
    </template>
    <template x-if="view.status === 'ready' && tableMode()">
      <div class="var-table" x-data="chartTable({ table: () => tableOf() })" data-testid="ag-table">
        <!-- @include partials/charts/table.html -->
      </div>
    </template>
  </section>
  <!-- @include partials/ag/history-chip.html -->
  <!-- @include partials/ag/stats.html -->
</div>
