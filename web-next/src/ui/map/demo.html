<!doctype html>
<!-- Manual / Playwright review page for ui/map: both station-map presets on
     the live /stations API (dev proxy /_api), with theme, network-filter and
     keyboard-picker controls. Same CSP as index.html (minus the anti-flash
     hash: this page's only inline script is the MapLibre import map). ?theme=dark|light|high-contrast;
     ?fixture=xss renames a station to markup to prove popups render text.
     Not part of the app build; serve with Vite at /src/ui/map/demo.html. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self' 'sha256-NgHBdw+Nl6S2kTHNyvv5uFwHfytmfDJR39Y9qVPt/UI=' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com;
    worker-src 'self' blob: https://unpkg.com;
    style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com;
    font-src https://cdn.jsdelivr.net;
    img-src 'self' data: blob: https://cdn.jsdelivr.net https://data2.climate.umt.edu https://api.weather.gov;
    connect-src 'self' https://mesonet2.climate.umt.edu https://data2.climate.umt.edu https://api.weather.gov https://raw.githubusercontent.com https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://s3.amazonaws.com https://cdn.jsdelivr.net https://unpkg.com;
    base-uri 'self';
    form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Maps · MT Mesonet</title>
  <link rel="icon" href="data:,">
  <script type="importmap">{"integrity":{"https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs":"sha384-KQzExYlfg1SnYNpLaXHTnaCTjr5wmiZ6X3sasvPb94caZfH+3+T1Sl4eJziXUtmN","https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl-shared.mjs":"sha384-V59ofCEPEqpSk5Mswc19DtDYbZWJtne210dFzS328Il6O31eLwTV7v57+Z3NjW/7"}}</script>
  <link rel="modulepreload" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs"
        integrity="sha384-KQzExYlfg1SnYNpLaXHTnaCTjr5wmiZ6X3sasvPb94caZfH+3+T1Sl4eJziXUtmN"
        crossorigin="anonymous">
  <link rel="modulepreload" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl-shared.mjs"
        integrity="sha384-V59ofCEPEqpSk5Mswc19DtDYbZWJtne210dFzS328Il6O31eLwTV7v57+Z3NjW/7"
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css"
        integrity="sha384-ntw3zEt6rcVML7jDK0ULmHa5hxLB23afsPqzqfY+gLgMfAkbFCnCgPpkZvV5mmZX"
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mt-climate-office/mco-web-style@0.11.2/theme/mco-theme.css"
        integrity="sha384-22H/4uZb4dmkrTZlLp4NJ4J+Wg39RNRIVIKO0x1HPYfyUWj81FA0fyM/uoRqbqme"
        crossorigin="anonymous">
  <link rel="stylesheet" href="./demo.css">
  <script type="module" src="./demo.ts"></script>
</head>
<body>
<main id="main" tabindex="-1" x-data>
  <h1>Station maps</h1>
  <p class="demo-lede">Both presets share one host. Status: <span data-testid="status" x-text="$store.demo.status"></span>.
    Selected: <code data-testid="selected" x-text="$store.demo.selected ?? 'none'"></code></p>

  <div class="demo-controls">
    <div class="seg-btns" role="group" aria-label="Theme">
      <template x-for="t in $store.demo.themes" :key="t">
        <button type="button" class="nav-btn" :data-theme-btn="t" :aria-pressed="String($store.demo.theme === t)"
                @click="$store.demo.setTheme(t)" x-text="t"></button>
      </template>
    </div>
    <div class="seg-btns" role="group" aria-label="Networks shown">
      <template x-for="n in $store.demo.networks" :key="n">
        <button type="button" class="nav-btn" :data-net="n" :aria-pressed="String($store.demo.netOn(n))"
                @click="$store.demo.toggleNet(n)" x-text="n"></button>
      </template>
    </div>
    <label class="demo-pick">Station
      <select data-testid="picker" @change="$store.demo.select($event.target.value || null)">
        <option value="">(none)</option>
        <template x-for="s in $store.demo.sorted" :key="s.station">
          <option :value="s.station" :selected="s.station === $store.demo.selected" x-text="`${s.name} (${s.station})`"></option>
        </template>
      </select>
    </label>
  </div>

  <section aria-labelledby="h-latest">
    <h2 id="h-latest">stationMap (Latest card)</h2>
    <div class="demo-map" data-testid="station-map"
         x-data="stationMap({ stations: () => $store.demo.stations, selected: () => $store.demo.selected,
                 visible: () => $store.demo.visible, onSelect: (id) => $store.demo.select(id) })"></div>
  </section>
</main>

  <script src="https://cdn.jsdelivr.net/gh/mt-climate-office/mco-web-style@0.11.2/core/mco-core.js"
          integrity="sha384-b4r3+tK/yiZ4TNEllSsbDX3qW0NhcHDsF2iPzUWunUc2vNf1qlq9t9qo2YWgoZiK"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/gh/mt-climate-office/mco-web-style@0.11.2/map/mco-map.js"
          integrity="sha384-tmDqtqi4yYiDHOxkZikwzXF3Lpkb63b0Tu6K7jeCpU9gJkPB2GbpFHLasGHka6zP"
          crossorigin="anonymous"></script>
</body>
</html>
