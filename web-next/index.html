<!DOCTYPE html>
<!-- Montana Mesonet Dashboard (web-next). Head follows mco-web-style
     snippets/head.html @0.7.1; body markup lives in partials/ (inlined at
     build by vite/include.ts). The kit version + SRI hashes live ONLY here. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Meta CSP (Pages cannot set headers). 'unsafe-eval': Alpine's standard
       build compiles x-* expressions with Function(); acceptable for a static,
       read-only app (ARCHITECTURE.md). The sha256 pins the inline anti-flash
       script below; vite/indexHtml.test.ts fails if they drift apart. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self' 'sha256-o+rXj9Jy2CUuPoewBVeBz2GYT71qiUGzjc3SklYSaSw=' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com;
    worker-src 'self' blob:;
    style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com;
    font-src https://cdn.jsdelivr.net;
    img-src 'self' data: blob: https://cdn.jsdelivr.net https://data2.climate.umt.edu https://api.weather.gov;
    connect-src 'self' https://mt-climate-office.goatcounter.com https://mesonet2.climate.umt.edu https://data2.climate.umt.edu https://api.weather.gov https://raw.githubusercontent.com https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://s3.amazonaws.com https://cdn.jsdelivr.net https://unpkg.com;
    base-uri 'self';
    form-action 'none'">
  <!-- viewport-fit=cover makes the kit's env(safe-area-inset-*) padding live. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="author" content="Montana Climate Office">
  <meta name="theme-color" content="#1a6faf" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161b22" media="(prefers-color-scheme: dark)">

  <!-- Anti-flash theme boot: kit snippets/anti-flash.html, inline, verbatim. -->
  <script>
    (function () {
      const raw = new URLSearchParams(location.search).get('theme');
      const url = raw == null ? null : raw.toLowerCase();
      let saved = null;
      try { saved = localStorage.getItem('mco-theme'); } catch (e) {}
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const valid = ['dark', 'light', 'high-contrast'];
      const t = valid.includes(url) ? url
              : valid.includes(saved) ? saved
              : (prefersDark ? 'dark' : 'light');
      const root = document.documentElement;
      root.setAttribute('data-theme', t);
      root.classList.toggle('is-compact', window.matchMedia('(max-width: 640px), (max-height: 560px)').matches);
      root.classList.toggle('is-touch', window.matchMedia('(hover: none)').matches);
    })();
  </script>

  <title>Dashboard · MT Mesonet</title>
  <meta name="description" content="Live and historical weather, soil and agricultural data from every Montana Mesonet station.">
  <link rel="canonical" href="https://mt-climate-office.github.io/mesonet-dashboard/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Montana Mesonet">
  <meta property="og:title" content="Dashboard · Montana Mesonet">
  <meta property="og:description" content="Live and historical weather, soil and agricultural data from every Montana Mesonet station.">
  <meta property="og:url" content="https://mt-climate-office.github.io/mesonet-dashboard/">
  <meta property="og:image" content="https://cdn.jsdelivr.net/gh/mt-climate-office/mco-web-style@0.7.1/assets/og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Montana Climate Office">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dashboard · Montana Mesonet">
  <meta name="twitter:description" content="Live and historical weather, soil and agricultural data from every Montana Mesonet station.">
  <meta name="twitter:image" content="https://cdn.jsdelivr.net/gh/mt-climate-office/mco-web-style@0.7.1/assets/og-card.png">

  <link rel="icon" type="image/png" sizes="32x32" href="https://cdn.jsdelivr.net/gh/mt-climate-office/mco-web-style@0.7.1/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://cdn.jsdelivr.net/gh/mt-climate-office/mco-web-style@0.7.1/assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://cdn.jsdelivr.net/gh/mt-climate-office/mco-web-style@0.7.1/assets/apple-touch-icon.png">

  <!-- House fonts (same @version as the theme CSS; crossorigin required, no integrity). -->

        as="font" type="font/woff2" crossorigin>

        integrity="sha384-q7EDwLXBfakVimqzBJqFCTxpgy7B18buhebV158qkVMCEVAaUnU3fQTEfWgYz+7g"
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mt-climate-office/mco-web-style@0.7.1/theme/mco-theme.css"

        crossorigin="anonymous">
  <script type="module" src="/src/main.ts"></script>
