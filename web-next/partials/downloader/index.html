<!-- The Download sheet's form (ui/downloader/downloader.ts), inside partials/sheets/download.html:
     summary rows (label left, value right) that expand in place one at a time to show their
     control, a fixed Station line (the header picks the station), one primary button
     (Preview, then "Download CSV · N rows"), the preview, the BLM funding line.
     Controls follow ui/controls/README.md. Mounted only while the sheet is open. -->
<div class="dl-tab" x-data="downloader" data-testid="downloader">
  <form class="dl-form" aria-label="Download request" novalidate @submit.prevent="act()">
    <div class="dl-rows">
      <!-- Variables: chips for the selection; "+ Add variables" opens the grouped checklist. -->
      <div class="dl-row" data-testid="dl-row-vars">
        <h3 class="dl-row-head">
          <button type="button" class="dl-row-btn" id="dl-row-vars-btn" aria-controls="dl-row-vars-panel"
                  :aria-expanded="isOpen('vars')" @click="toggleRow('vars')">
            <span class="dl-row-label">Variables</span>
            <span class="dl-row-value"><span class="dl-row-text" x-text="varsText"></span></span>
            <svg class="dl-row-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </h3>
        <div class="dl-row-panel" id="dl-row-vars-panel" role="region" aria-labelledby="dl-row-vars-btn" x-show="isOpen('vars')">
          <div class="ctl-multiselect" x-show="stationId" x-data="multiselect({ groups: () => groups,
               value: () => pruned.selected, onChange: (v) => setElements(v), label: 'Variables' })"
               data-testid="dl-elements">
            <ul x-ref="chips" class="ctl-chip-list" :aria-label="'Selected ' + label" x-show="selected().length > 0">
              <template x-for="v in selected()" :key="v">
                <li><button type="button" class="nav-btn ctl-chip" :aria-label="'Remove ' + labelOf(v)"
                            @click="remove(v, $event)"><span x-text="labelOf(v)"></span>
                    <span aria-hidden="true">&times;</span></button></li>
              </template>
            </ul>
            <button type="button" class="nav-btn ctl-disclosure" :id="ids.button"
                    :aria-expanded="open" :aria-controls="ids.panel" @click="toggle()">
              <span>+ Add variables</span><span class="ctl-count" x-text="countText()"></span>
            </button>
            <div class="ctl-multiselect-panel" role="group" :id="ids.panel"
                 :aria-labelledby="ids.button" x-show="open" @keydown.escape.prevent.stop="escape()">
              <label class="ctl-label" :for="ids.filter">Filter</label>
              <input type="search" class="ctl-input" :id="ids.filter" x-model="query" autocomplete="off">
              <p class="ctl-note" x-show="elements?.status === 'loading'">Loading variables…</p>
              <template x-for="group in visibleGroups" :key="group.id">
                <fieldset class="ctl-fieldset">
                  <legend class="ctl-legend" x-text="group.label"></legend>
                  <label class="ctl-check ctl-check-all">
                    <input type="checkbox" :checked="stateOf(group) === 'all'"
                           x-effect="markMixed($el, group)" @change="setGroup(group, $event)">
                    <span>Select all</span></label>
                  <template x-for="opt in group.options" :key="opt.value">
                    <label class="ctl-check">
                      <input type="checkbox" :checked="isSelected(opt.value)" @change="toggleValue(opt.value)">
                      <span x-text="opt.label"></span></label>
                  </template>
                </fieldset>
              </template>
              <p class="ctl-note" x-show="visibleGroups.length === 0">No matches</p>
            </div>
          </div>
          <label class="ctl-check dl-switch">
            <input type="checkbox" role="switch" :checked="url.pub" @change="toggleUncommon($event)" data-testid="dl-uncommon">
            <span>Show uncommon variables</span>
          </label>
        </div>
      </div>

      <!-- Dates: bounded by the install date and today. -->
      <div class="dl-row" data-testid="dl-row-dates">
        <h3 class="dl-row-head">
          <button type="button" class="dl-row-btn" id="dl-row-dates-btn" aria-controls="dl-row-dates-panel"
                  :aria-expanded="isOpen('dates')" @click="toggleRow('dates')">
            <span class="dl-row-label">Dates</span>
            <span class="dl-row-value"><span class="dl-row-text" x-text="datesText"></span></span>
            <svg class="dl-row-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </h3>
        <div class="dl-row-panel" id="dl-row-dates-panel" role="region" aria-labelledby="dl-row-dates-btn" x-show="isOpen('dates')">
          <fieldset class="ctl-fieldset" x-data="dateRange({ value: () => ({ start: dates.start, end: dates.end }),
                    onChange: (r) => setDates(r), min: () => installDate, max: () => today, label: 'Dates',
                    onValidity: (v) => setRangeValid(v), showError: () => showRangeError() })"
                    data-testid="dl-dates">
            <legend class="sr-only" x-text="label"></legend>
            <div class="ctl-row">
              <div class="ctl-field">
                <label class="ctl-label" :for="ids.start">Start</label>
                <input type="date" class="ctl-input" :id="ids.start" :min="min()" :max="max()"
                       :value="start" :aria-invalid="invalid('start')"
                       :aria-describedby="describedBy()" @change="setStart($event)">
              </div>
              <div class="ctl-field">
                <label class="ctl-label" :for="ids.end">End</label>
                <input type="date" class="ctl-input" :id="ids.end" :min="min()" :max="max()"
                       :value="end" :aria-invalid="invalid('end')"
                       :aria-describedby="describedBy()" @change="setEnd($event)">
              </div>
            </div>
            <p class="ctl-error" aria-live="polite" :id="ids.error" x-text="errorText()"></p>
          </fieldset>
          <p class="dl-msg" x-show="dates.clamped && dates.error" x-text="dates.error" data-testid="dl-install-error"></p>
          <p class="ctl-note" x-show="dates.clamped && !dates.error" data-testid="dl-start-clamped">
            Start date moved to <span x-text="installDate"></span>, when this station was installed.
          </p>
        </div>
      </div>

      <!-- Interval: the period key (hourly | daily | monthly). -->
      <div class="dl-row" data-testid="dl-row-interval">
        <h3 class="dl-row-head">
          <button type="button" class="dl-row-btn" id="dl-row-interval-btn" aria-controls="dl-row-interval-panel"
                  :aria-expanded="isOpen('interval')" @click="toggleRow('interval')">
            <span class="dl-row-label">Interval</span>
            <span class="dl-row-value"><span class="dl-row-text" x-text="intervalText"></span></span>
            <svg class="dl-row-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </h3>
        <div class="dl-row-panel" id="dl-row-interval-panel" role="region" aria-labelledby="dl-row-interval-btn" x-show="isOpen('interval')">
          <fieldset class="ctl-seg" x-data="segmented({ options: () => periodOptions, value: () => url.period,
                    onChange: (v) => setPeriod(v), label: 'Interval' })" data-testid="dl-period">
            <legend class="sr-only" x-text="label"></legend>
            <div class="seg-btns">
              <template x-for="opt in options()" :key="opt.value">
                <label class="nav-btn seg-btn">
                  <input type="radio" :name="name" :value="opt.value" :checked="isChecked(opt.value)"
                         :disabled="opt.disabled ?? false" @change="select(opt.value)">
                  <span x-text="opt.label"></span>
                </label>
              </template>
            </div>
          </fieldset>
          <p class="ctl-note" x-show="url.period === 'monthly'" x-text="monthlyNote"></p>
        </div>
      </div>

      <!-- Quality: the qc key; plain labels, the same levels (2, 1, 0). -->
      <div class="dl-row" data-testid="dl-row-quality">
        <h3 class="dl-row-head">
          <button type="button" class="dl-row-btn" id="dl-row-quality-btn" aria-controls="dl-row-quality-panel"
                  :aria-expanded="isOpen('quality')" @click="toggleRow('quality')">
            <span class="dl-row-label">Quality</span>
            <span class="dl-row-value"><span class="dl-row-text" x-text="qcOption.label"></span></span>
            <svg class="dl-row-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </h3>
        <div class="dl-row-panel" id="dl-row-quality-panel" role="region" aria-labelledby="dl-row-quality-btn" x-show="isOpen('quality')">
          <fieldset class="ctl-seg dl-seg-stack" x-data="segmented({ options: () => qcOptions, value: () => String(qc),
                    onChange: (v) => setQc(v), label: 'Quality' })" data-testid="dl-qc">
            <legend class="sr-only" x-text="label"></legend>
            <div class="seg-btns">
              <template x-for="opt in options()" :key="opt.value">
                <label class="nav-btn seg-btn">
                  <input type="radio" :name="name" :value="opt.value" :checked="isChecked(opt.value)"
                         :disabled="opt.disabled ?? false" @change="select(opt.value)">
                  <span x-text="opt.label"></span>
                </label>
              </template>
            </div>
          </fieldset>
          <p class="ctl-note" x-text="qcOption.description"></p>
        </div>
      </div>

      <!-- Station: the header's; changed there, not here. -->
      <div class="dl-row dl-row-static" data-testid="dl-station">
        <span class="dl-row-label">Station</span>
        <span class="dl-row-value"><span class="dl-row-text" x-text="stationText"></span></span>
      </div>
    </div>

    <p class="dl-msg" x-show="droppedNotice" x-text="droppedNotice" data-testid="dl-dropped-swp"></p>
    <p class="dl-msg dl-msg-action" role="alert" x-show="elements?.status === 'error'" data-testid="dl-elements-error">
      <span>Variables could not be loaded.</span>
      <button type="button" class="nav-btn" @click="elements?.refresh()">Retry</button>
    </p>
    <p class="dl-msg" x-show="dates.largeHourly && !current" x-text="largeHourlyText()" data-testid="dl-large-hourly"></p>

    <!-- One button: Preview fetches; with a result for these inputs it saves the CSV (data-testid dl-run, then dl-download). -->
    <button type="submit" class="nav-btn dl-btn-primary" :data-testid="actionTestId" :aria-disabled="String(action.disabled)" :aria-busy="String(action.busy)"
            :aria-describedby="action.reason ? 'dl-reason' : null">
      <svg x-show="action.kind === 'download'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      <span x-text="action.label"></span>
    </button>
    <p class="dl-reason" id="dl-reason" x-show="action.reason" x-text="action.reason" data-testid="dl-hint"></p>
    <template x-for="w in result?.warnings ?? []" :key="w">
      <p class="dl-msg" x-text="w"></p>
    </template>
  </form>

  <section class="dl-preview" x-show="current" aria-labelledby="dl-preview-title" data-testid="dl-preview">
    <h3 class="dl-preview-title" id="dl-preview-title">Preview</h3>
    <p class="dl-preview-status" x-show="previewStatus()" x-text="previewStatus()"
       :class="{ 'is-error': run?.status === 'error' }"></p>
    <!-- x-if: the host is created only once there is a model, so ECharts never inits in a hidden box. -->
    <template x-if="previewModel()">
      <div class="chart" :style="previewStyle()"
           x-data="chart({ builder: previewBuilder, table: previewTable, label: 'Preview of the requested data', model: () => previewModel() })"></div>
    </template>
  </section>

  <footer class="dl-funding" data-testid="dl-funding-footer">
    <p>Supported by Bureau of Land Management (RM-CESU Award L16AC00359)</p>
  </footer>
</div>
