<!-- All current readings (x-data="aboutReadings", ui/about/readings.ts): the former Current Conditions
     table, then the HydroMet precipitation summary. The tables scroll inside a named, focusable region
     (WCAG 2.1.1). #about-readings is the target of Now's "All readings" link. -->
<section class="dash-card about-readings" id="about-readings" tabindex="-1" x-data="aboutReadings" aria-labelledby="about-readings-title" data-testid="about-readings">
  <h3 class="dash-card-title" id="about-readings-title">All current readings</h3>
  <template x-if="state === 'loading'">
    <div aria-busy="true"><p class="sr-only" role="status">Loading current readings…</p><span class="dash-skel dash-skel--table" aria-hidden="true"></span></div>
  </template>
  <template x-if="state === 'error'"><p class="about-message">Current readings are unavailable: the Mesonet API did not answer.</p></template>
  <template x-if="state === 'empty'"><p class="about-message">No recent observations.</p></template>
  <template x-if="state === 'ready'">
    <div class="about-scroll" role="region" aria-label="All current readings (scrollable)" tabindex="0">
      <table class="about-table" data-testid="about-readings-table">
        <caption>Latest observation</caption>
        <thead><tr><th scope="col">Reading</th><th scope="col">Value</th></tr></thead>
        <tbody>
          <template x-for="r in rows" :key="r[0]">
            <tr><th scope="row" x-text="r[0]"></th><td x-text="r[1]"></td></tr>
          </template>
        </tbody>
      </table>
      <template x-if="pptRows.length">
        <table class="about-table" data-testid="about-ppt-table">
          <caption>Precipitation summary</caption>
          <thead><tr><th scope="col">Period</th><th scope="col">Total</th></tr></thead>
          <tbody>
            <template x-for="r in pptRows" :key="r[0]">
              <tr><th scope="row" x-text="r[0]"></th><td x-text="r[1]"></td></tr>
            </template>
          </tbody>
        </table>
      </template>
    </div>
  </template>
</section>
