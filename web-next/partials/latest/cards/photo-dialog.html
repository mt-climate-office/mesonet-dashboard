<!-- Photo dialog (inside an x-data="photoCard" element; ui/latest/cards/photoCard.ts `enlarge()`):
     the shown webp_large frame and "Download original". Shared by the Latest photo pane and the
     Now photo tile. -->
<dialog class="mco-modal lc-photo-modal" x-ref="dialog" aria-labelledby="photo-modal-title" data-testid="photo-modal">
  <div class="info-modal-box lc-photo-modal-box">
    <div class="info-modal-header">
      <h2 class="info-modal-title" id="photo-modal-title" x-text="title()"></h2>
      <button type="button" class="modal-close" data-close-modal aria-label="Close">×</button>
    </div>
    <template x-if="pick && pick.active">
      <div class="lc-photo-modal-body">
        <img :src="pick.active.webpUrl" :alt="pick.alt">
        <a class="nav-btn lc-download" :href="pick.active.webpUrl" :download="fileName()" target="_blank" rel="noopener noreferrer"
           @click="download($event)" data-testid="photo-download">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
          <span>Download original</span>
        </a>
      </div>
    </template>
  </div>
</dialog>
