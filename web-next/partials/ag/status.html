<!-- Shared card body for every Ag view component (needs `view`): notes,
     then the loading / error / empty message in place of the chart. -->
<ul class="ag-notes" x-show="view.notes.length > 0" data-testid="ag-notes">
  <template x-for="(n, i) in view.notes" :key="i">
    <li class="ag-note">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span x-text="n"></span>
    </li>
  </template>
</ul>
<div class="ag-state" x-show="view.status === 'loading'" data-testid="ag-loading">
  <span class="ag-spinner" aria-hidden="true"></span><span>Loading…</span>
</div>
<p class="ag-state ag-error" x-show="view.status === 'error'" x-text="view.message" data-testid="ag-error"></p>
<p class="ag-state" x-show="view.status === 'empty'" x-text="view.message" data-testid="ag-empty"></p>
