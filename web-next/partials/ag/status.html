<!-- Shared card body for every Ag view component (needs `view`): the notes folded into one ⓘ
     toggletip at the card's top right, under the option chips (so they never push the chart down),
     then the loading / error / empty message in place of the chart. One Ag view is mounted at a time,
     so the tip's id is unique. -->
<div class="ag-notes" x-show="view.notes.length > 0" data-testid="ag-notes">
  <span class="dash-toggletip" x-data="toggletip">
    <button type="button" class="nav-btn mco-btn-info dash-toggletip-btn" aria-controls="ag-notes-tip" aria-expanded="false"
            :aria-label="'Notes about this chart (' + view.notes.length + ')'" data-testid="ag-notes-button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    </button>
    <span class="dash-toggletip-tip ag-notes-tip" id="ag-notes-tip" hidden>
      <template x-for="(n, i) in view.notes" :key="i"><span class="ag-note" x-text="n"></span></template>
    </span>
  </span>
</div>
<div class="ag-state" x-show="view.status === 'loading'" data-testid="ag-loading">
  <span class="ag-spinner" aria-hidden="true"></span><span>Loading…</span>
</div>
<template x-if="view.status === 'error'">
  <div class="ag-state" data-testid="ag-error"><!-- @include partials/load-error.html --></div>
</template>
<p class="ag-state" x-show="view.status === 'empty'" x-text="view.message" data-testid="ag-empty"></p>
