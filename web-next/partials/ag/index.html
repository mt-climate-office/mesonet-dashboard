<!-- An Ag tool inside Charts (x-data="agTab", ui/ag/agTab.ts), shown while `v` is an Ag tool id
     (core/variables chartsMode 'ag'; partials/charts/index.html): "‹ All charts", the tool's
     heading, the Options disclosure, the chart card. Temporary host until the tool pages move to
     the variable-page frame (REDESIGN.md "Ag tool pages"). -->
<div class="ag" x-data="agTab" data-testid="ag-tool">
  <a class="dash-link ag-back" :href="listHref()" @click="toList($event)" data-testid="ag-back">
    <span aria-hidden="true">‹ </span>All charts</a>
  <h2 class="ag-heading" id="ag-chart-title" tabindex="-1" x-text="title()"></h2>
  <!-- @include partials/ag/controls.html -->
  <section class="dash-card ag-chart-card" aria-labelledby="ag-chart-title">
    <template x-if="state() === 'loading-stations'">
      <p class="ag-state">Loading stations…</p>
    </template>
    <template x-if="state() === 'no-station'">
      <div class="ag-state ag-no-station" data-testid="ag-no-station">
        <p class="ag-no-station-title">Select Station</p>
        <p>To get started, select a station from the dropdown.</p>
      </div>
    </template>
    <template x-if="show('met')">
      <!-- @include partials/ag/met.html -->
    </template>
    <template x-if="show('gdd')">
      <!-- @include partials/ag/gdd.html -->
    </template>
    <template x-if="show('soil')">
      <!-- @include partials/ag/soil.html -->
    </template>
    <template x-if="show('annual')">
      <!-- @include partials/ag/annual.html -->
    </template>
  </section>
</div>
