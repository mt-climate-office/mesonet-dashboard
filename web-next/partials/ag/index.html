<!-- An Ag tool inside Charts (x-data="agTab", ui/ag/agTab.ts), shown while `v` is an Ag tool id
     (core/variables chartsMode 'ag'; partials/charts/index.html), in the variable page's frame: back ·
     title · ⋮ menu (as the variable page's); the station; the option chips (partials/ag/options.html), only where the tool
     applies; the chart card (Reference ET adds All years under it, partials/ag/history-chip.html) (or its table with tbl=1) and, where meaningful, a stats card. Without a
     station, or for an SWP tool at a station without soil parameters, the card says why and opens the
     header's station picker. -->
<div class="ag chart-page" x-data="agTab" data-testid="ag-tool">
  <div class="chart-head">
    <a class="dash-icon-btn ag-back" :href="listHref()" @click="toList($event)" :aria-label="backLabel('All charts')" data-testid="ag-back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h2 class="chart-title" id="ag-chart-title" tabindex="-1" data-vt-target x-text="title()"></h2>
    <div class="dash-menu" x-data="menu" data-testid="ag-menu">
      <button type="button" class="dash-icon-btn" data-menu-button aria-expanded="false" aria-label="More for this chart" data-testid="ag-menu-button">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
      <div class="dash-menu-panel" id="ag-menu" role="menu" aria-label="More for this chart" hidden>
        <button type="button" class="dash-menu-item" role="menuitem" aria-haspopup="dialog" @click="download()" data-testid="ag-menu-download">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10M7.5 9.5L12 14l4.5-4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          Download data
        </button>
        <button type="button" class="dash-menu-item" role="menuitem" @click="toggleTable()" data-testid="ag-menu-table">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM4 10h16M10 10v9"/></svg>
          <span x-text="tableMode() ? 'Show as chart' : 'Show as table'"></span>
        </button>
        <button type="button" class="dash-menu-item" role="menuitem" @click="share()" data-testid="ag-menu-share">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14V4M7.5 8.5L12 4l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          Share this chart
        </button>
        <a class="dash-menu-item" role="menuitem" :href="learnHref()" target="_blank" rel="noopener noreferrer" data-testid="ag-learn-more">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 11v5"/><circle cx="12" cy="8" r="1.2" fill="currentColor" stroke="none"/></svg>
          About this tool<span class="sr-only"> (opens in a new tab)</span>
        </a>
        <template x-if="near.prev || near.next"><hr class="dash-menu-sep"></template>
        <template x-if="near.prev">
          <button type="button" class="dash-menu-item" role="menuitem" @click="step(-1)" data-testid="var-prev">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg>
            <span x-text="'Previous: ' + nameOf(near.prev)"></span>
          </button>
        </template>
        <template x-if="near.next">
          <button type="button" class="dash-menu-item" role="menuitem" @click="step(1)" data-testid="var-next">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6l6 6-6 6"/></svg>
            <span x-text="'Next: ' + nameOf(near.next)"></span>
          </button>
        </template>
      </div>
    </div>
  </div>
  <p class="chart-sub" x-show="subline()" x-text="subline()"></p>

  <template x-if="!history() && showsOptions(state())">
    <div class="ag-opts-row">
      <!-- @include partials/ag/options.html -->
    </div>
  </template>

  <template x-if="state() !== 'chart'">
    <section class="dash-card ag-chart-card chart-card" aria-labelledby="ag-chart-title">
      <template x-if="state() === 'loading-stations'">
        <p class="ag-state">Loading stations…</p>
      </template>
      <template x-if="state() === 'no-station'">
        <div class="ag-state ag-no-station" data-testid="ag-no-station">
          <p>Pick a station to see this tool.</p>
          <button type="button" class="nav-btn" @click="pickStation($event)">Choose a station</button>
        </div>
      </template>
      <template x-if="state() === 'not-here'">
        <div class="ag-state ag-no-station" data-testid="ag-not-here">
          <p x-text="notHere()"></p>
          <button type="button" class="nav-btn" @click="pickStation($event)">Choose another station</button>
        </div>
      </template>
    </section>
  </template>
  <template x-if="show('met')">
    <!-- @include partials/ag/met.html -->
  </template>
  <template x-if="show('gdd')">
    <!-- @include partials/ag/gdd.html -->
  </template>
  <template x-if="show('soil')">
    <!-- @include partials/ag/soil.html -->
  </template>
  <template x-if="show('annual')">
    <!-- @include partials/ag/annual.html -->
  </template>
  <template x-if="state() === 'chart' && history()">
    <section class="dash-card chart-card" aria-label="All years">
      <!-- @include partials/charts/history.html -->
    </section>
  </template>
  <template x-if="state() === 'chart' && history()">
    <!-- @include partials/ag/history-chip.html -->
  </template>
</div>
