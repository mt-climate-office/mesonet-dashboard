<!-- Ag Tools controls card (ui/ag/agControls.ts). Every control reads and
     writes $store.url; the variable-specific panels follow legacy
     app.py:628-683 (time agg for etr/feels/cci/swp/ps; GDD; soil; annual). -->
<section class="ag-card ag-controls" aria-label="Ag Tools controls" x-data="agControls" data-testid="ag-controls">
  <div class="ag-col">
    <div class="ctl-combobox" data-testid="ag-station"
         x-data="combobox({ items: () => stations(), value: () => $store.url.state.s,
                 onSelect: (id) => setStation(id), label: 'Station', placeholder: stationPlaceholder() })"
         @focusout="onFocusOut($event)">
      <label class="ctl-label" :id="ids.label" :for="ids.input" x-text="label"></label>
      <div class="ctl-combobox-field">
        <input x-ref="input" class="ctl-input" type="text" role="combobox"
               autocomplete="off" spellcheck="false" aria-autocomplete="list"
               :id="ids.input" :placeholder="stationPlaceholder()" :aria-expanded="open"
               :aria-controls="ids.listbox" :aria-activedescendant="activeId()"
               :value="inputText()" @input="onInput($event)"
               @keydown="onKeydown($event)" @click="toggle()">
        <button type="button" class="ctl-clear" x-show="hasValue()"
                :aria-label="'Clear ' + label" @click="clear()">&times;</button>
      </div>
      <div class="ctl-combobox-popup" x-show="open">
        <div role="listbox" class="ctl-combobox-list" :id="ids.listbox"
             :aria-labelledby="ids.label" x-show="result.total > 0">
          <template x-for="group in result.groups" :key="group.name ?? ''">
            <ul :role="group.name ? 'group' : 'presentation'"
                :aria-labelledby="group.name ? groupId(group.name) : null">
              <li role="presentation" class="ctl-combobox-group" x-show="group.name"
                  :id="group.name ? groupId(group.name) : null" x-text="group.name"></li>
              <template x-for="item in group.items" :key="item.id">
                <li role="option" class="ctl-option" :id="optionId(item.id)"
                    :aria-selected="isActive(item.id)" :class="{ 'is-current': isCurrent(item.id) }"
                    @mousedown.prevent @click="select(item.id)">
                  <span x-text="item.label"></span>
                  <span class="ctl-option-meta" x-text="item.id"></span>
                </li>
              </template>
            </ul>
          </template>
        </div>
        <p class="ctl-combobox-note" x-show="note()" x-text="note()"></p>
      </div>
      <div role="status" class="sr-only" x-text="status()"></div>
    </div>

    <div class="ag-row">
      <div class="ctl-field ag-grow" data-testid="ag-variable"
           x-data="timeSelect({ options: () => variables, value: () => tab.variable,
                   onChange: (v) => setVariable(v), label: 'Variable' })">
        <label class="ctl-label" :for="ids.select" x-text="label"></label>
        <select class="ctl-input ctl-select" :id="ids.select" @change="set($event)">
          <template x-for="opt in options()" :key="opt.value">
            <option :value="opt.value" :selected="isSelected(opt.value)" x-text="opt.label"></option>
          </template>
        </select>
      </div>
      <a class="nav-btn ag-learn" :href="learnHref()" target="_blank" rel="noopener noreferrer" data-testid="ag-learn-more">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        Learn More<span class="sr-only"> about this variable (opens in a new tab)</span>
      </a>
    </div>
  </div>

  <div class="ag-col">
    <template x-if="tab.showDates">
      <fieldset class="ctl-fieldset" data-testid="ag-dates"
                x-data="dateRange({ value: () => ({ start: tab.start, end: tab.end }),
                        onChange: (r) => setDates(r), max: () => today(), label: 'Date range' })">
        <legend class="ctl-legend" x-text="label"></legend>
        <div class="ctl-row">
          <div class="ctl-field">
            <label class="ctl-label" :for="ids.start">Start</label>
            <input type="date" class="ctl-input" :id="ids.start" :min="min()" :max="max()"
                   :value="start" :aria-invalid="invalid('start')"
                   :aria-describedby="describedBy()" @change="setStart($event)">
          </div>
          <div class="ctl-field">
            <label class="ctl-label" :for="ids.end">End</label>
            <input type="date" class="ctl-input" :id="ids.end" :min="min()" :max="max()"
                   :value="end" :aria-invalid="invalid('end')"
                   :aria-describedby="describedBy()" @change="setEnd($event)">
          </div>
        </div>
        <p class="ctl-error" aria-live="polite" :id="ids.error" x-text="errorText()"></p>
      </fieldset>
    </template>

    <template x-if="tab.showTimeAgg">
      <fieldset class="ctl-seg" data-testid="ag-time"
                x-data="segmented({ options: () => times, value: () => tab.period,
                        onChange: (v) => setTime(v), label: 'Time aggregation' })">
        <legend class="ctl-legend" x-text="label"></legend>
        <div class="seg-btns">
          <template x-for="opt in options()" :key="opt.value">
            <label class="nav-btn seg-btn">
              <input type="radio" :name="name" :value="opt.value" :checked="isChecked(opt.value)" @change="select(opt.value)">
              <span x-text="opt.label"></span>
            </label>
          </template>
        </div>
      </fieldset>
    </template>

    <template x-if="tab.variable === 'cci'">
      <fieldset class="ctl-seg" data-testid="ag-livestock"
                x-data="segmented({ options: () => livestock, value: () => tab.livestock,
                        onChange: (v) => setLivestock(v), label: 'Livestock type' })">
        <legend class="ctl-legend" x-text="label"></legend>
        <div class="seg-btns">
          <template x-for="opt in options()" :key="opt.value">
            <label class="nav-btn seg-btn">
              <input type="radio" :name="name" :value="opt.value" :checked="isChecked(opt.value)" @change="select(opt.value)">
              <span x-text="opt.label"></span>
            </label>
          </template>
        </div>
      </fieldset>
    </template>
  </div>

  <div class="ag-col">
    <!-- @include partials/ag/controls-variable.html -->
  </div>
</section>
