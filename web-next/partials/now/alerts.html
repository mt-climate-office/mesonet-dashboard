<!-- NWS hazard banners (inside x-data="nowView"; model core/overview alertBanners): active warnings,
     watches and advisories for the station's point, above the current conditions on Now and the
     dashboard. Kit notices: the event name is the tone word, so color is never the only channel; the
     NWS text opens in place, the forecast page (which lists the hazards) in a new tab. -->
<section class="now-alerts" x-show="alerts.length" aria-label="NWS hazard alerts" data-testid="now-alerts">
  <template x-for="a in alerts" :key="a.id">
    <div class="mco-notice now-alert" :data-tone="a.tone" data-testid="now-alert">
      <svg class="mco-notice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4" stroke-linecap="round"/><circle cx="12" cy="17" r="1.3" fill="currentColor" stroke="none"/></svg>
      <div class="mco-notice-text">
        <p><strong class="mco-notice-tone" x-text="a.event"></strong><span x-show="a.when" x-text="' ' + a.when"></span></p>
        <details class="now-alert-details" x-show="a.description || a.instruction">
          <summary>Details<span class="sr-only" x-text="' of the ' + a.event"></span></summary>
          <p class="now-alert-body" x-show="a.description" x-text="a.description"></p>
          <p class="now-alert-body" x-show="a.instruction" x-text="a.instruction"></p>
          <p><a :href="forecastUrl" target="_blank" rel="noopener noreferrer">NWS forecast and hazards<span class="sr-only"> (opens in a new tab)</span></a></p>
        </details>
      </div>
    </div>
  </template>
</section>
