<!-- Now's hero (inside x-data="nowView", ui/now/nowView.ts): temperature, high/low against normal, the
     summary, freshness, the 48 h strip with forecast icons. Used by Now and the dashboard's conditions card. -->
<section class="dash-card now-hero" aria-labelledby="now-hero-title" data-testid="now-hero">
  <h2 class="sr-only" id="now-hero-title">Current conditions</h2>
  <!-- The temperature and summary open the Air temperature page, as a tile opens its own; the link's
       hit area covers the card (styles/now.css) under the card's own controls. -->
  <a class="now-hero-link" :href="href('air_temp')" @click="open($event, 'air_temp')" data-testid="now-hero-link">
  <span class="sr-only">Air temperature: </span>
  <div class="now-hero-top">
    <p class="now-temp num-display" data-testid="now-temp">
      <span x-text="page.hero.temp ?? '—'"></span><span class="now-temp-unit" x-show="page.hero.temp">F</span>
    </p>
    <p class="now-hilo">
      <span x-show="page.hero.highLow" x-text="page.hero.highLow"></span>
      <template x-if="tier2 && !page.hero.highLow"><span class="dash-skel dash-skel--line now-hilo-skel" aria-hidden="true"></span></template>
      <span class="now-dim" x-show="page.hero.normal" x-text="page.hero.normal"></span>
      <span x-show="page.hero.feels"><span x-text="page.hero.feels"></span><span class="now-dim" x-show="page.hero.feelsKind" x-text="' · ' + page.hero.feelsKind"></span></span>
    </p>
  </div>
  <p class="now-summary" x-show="page.hero.summary" x-text="page.hero.summary" data-testid="now-summary"></p>
  </a>
  <p class="now-fresh" x-show="page.hero.freshness" data-testid="now-freshness">
    <span class="now-updated" x-text="page.hero.freshness?.updated"></span>
    <template x-if="page.hero.freshness?.provisional">
      <span class="dash-toggletip" x-data="toggletip" data-testid="now-provisional">
        <span aria-hidden="true">·</span>
        <button type="button" class="now-prov-btn dash-toggletip-btn" aria-controls="now-provisional-tip" aria-expanded="false">Provisional</button>
        <span class="dash-toggletip-tip" id="now-provisional-tip" hidden><strong>Provisional data.</strong> Readings since the last daily quality-control run (about 8 AM) have had only basic range checks (QC level 1). They are replaced by fully checked level 2 values after the next run, so they may change.</span>
      </span>
    </template>
    <template x-if="page.hero.freshness?.stale">
      <span class="dash-badge dash-badge--warn" role="status" data-testid="now-stale">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="2.5" aria-hidden="true"><path d="M12 3l9 16H3z"/><path d="M12 10v4" stroke-linecap="round"/><circle cx="12" cy="17" r="1.4" fill="currentColor" stroke="none"/></svg>
        No report for over 2 hours
      </span>
    </template>
  </p>

  <div class="now-strip" data-testid="now-strip">
    <template x-if="tier2"><div><p class="sr-only" role="status">Loading the 48-hour strip…</p><span class="dash-skel now-strip-skel" aria-hidden="true"></span></div></template>
    <template x-if="!tier2 && page.hero.strip">
      <div class="chart now-strip-chart" x-data="chart(stripChart())"></div>
    </template>
    <template x-if="!tier2 && !page.hero.strip && loadError()">
      <!-- @include partials/load-error.html -->
    </template>
    <template x-if="!tier2 && !page.hero.strip && !loadError()">
      <p class="now-strip-empty" role="status" data-testid="now-strip-empty">No hourly temperatures or forecast to draw for the last and next 24 hours.</p>
    </template>
  </div>
  <ul class="now-icons" x-show="page.icons.length || tier2" aria-label="Forecast periods" data-testid="now-icons">
    <template x-for="p in page.icons" :key="p.t">
      <li><img :src="p.icon" :alt="p.short" width="32" height="32" loading="lazy"><span x-text="p.label"></span></li>
    </template>
  </ul>
  <div class="now-strip-foot">
    <!-- The samples draw the strip's own strokes: 1.5 px, and ECharts' "dashed" at that width (6 on, 3 off). -->
    <span class="now-legend" aria-hidden="true"><svg width="24" height="4" viewBox="0 0 24 4" focusable="false"><path d="M0 2h24"/></svg>Observed</span>
    <span class="now-legend" aria-hidden="true"><svg width="24" height="4" viewBox="0 0 24 4" focusable="false"><path d="M0 2h24" stroke-dasharray="6 3"/></svg>NWS forecast</span>
    <a class="dash-link now-forecast-link" :href="forecastUrl" target="_blank" rel="noopener noreferrer" data-testid="now-full-forecast">Full forecast<span class="sr-only"> (NWS, opens in a new tab)</span></a>
  </div>
</section>
