<!-- Photo dialog (inside an x-data="photoCard" element; ui/now/photoCard.ts `enlarge()`), opened from the
     Now photo tile: direction, day and time pickers over the data2 archive, the webp_large frame and
     "Download original". Its content mounts only while open; closing drops the picks (`closed()`). -->
<dialog class="mco-modal lc-photo-modal" x-ref="dialog" aria-labelledby="photo-modal-title" data-testid="photo-modal" @close="closed()">
  <div class="info-modal-box lc-photo-modal-box">
    <div class="info-modal-header">
      <h2 class="info-modal-title" id="photo-modal-title" x-text="title() || 'Station photos'"></h2>
      <button type="button" class="modal-close" data-close-modal aria-label="Close">×</button>
    </div>
    <template x-if="open">
      <div class="lc-photo-modal-body">
        <template x-if="hasControls">
          <div class="lc-photo-controls">
            <fieldset class="ctl-seg" data-testid="photo-directions"
                      x-data="segmented({ options: () => directionOptions(), value: () => directionValue(), onChange: (v) => selectDirection(v), label: 'Direction' })">
              <legend class="ctl-legend" x-text="label"></legend>
              <div class="seg-btns">
                <template x-for="opt in options()" :key="opt.value">
                  <label class="nav-btn seg-btn">
                    <input type="radio" :name="name" :value="opt.value" :checked="isChecked(opt.value)" @change="select(opt.value)">
                    <span x-text="opt.label"></span>
                  </label>
                </template>
              </div>
            </fieldset>
            <div class="lc-photo-pickers">
              <div class="ctl-field" x-data="dateInput({ value: () => day, onChange: (d) => selectDay(d), min: () => minDay(), max: () => today, label: 'Day' })">
                <label class="ctl-label" :for="ids.input" x-text="label"></label>
                <input type="date" class="ctl-input" :id="ids.input" :min="min()" :max="max()"
                       :value="draft" :aria-invalid="invalid()" :aria-describedby="describedBy()"
                       @change="set($event)" data-testid="photo-date">
                <p class="ctl-error" aria-live="polite" :id="ids.error" x-text="errorText()"></p>
              </div>
              <div class="ctl-field" x-data="timeSelect({ options: () => timeOptions(), value: () => timeValue(), onChange: (v) => selectTime(v), label: 'Time', emptyText: 'No photos this day' })">
                <label class="ctl-label" :for="ids.select" x-text="label"></label>
                <select class="ctl-input ctl-select" :id="ids.select" :disabled="isEmpty()" @change="set($event)" data-testid="photo-time">
                  <template x-if="isEmpty()"><option value="" x-text="emptyText"></option></template>
                  <template x-for="opt in options()" :key="opt.value">
                    <option :value="opt.value" :selected="isSelected(opt.value)" x-text="opt.label"></option>
                  </template>
                </select>
              </div>
            </div>
          </div>
        </template>
        <div class="lc-photo-view">
          <template x-if="state === 'loading'"><span class="dash-skel dash-skel--media" aria-hidden="true"></span></template>
          <template x-if="state === 'message'"><p class="lc-message" role="status" x-text="message()" data-testid="photo-message"></p></template>
          <template x-if="state === 'ready'">
            <img :src="pick.active.webpUrl" :alt="pick.alt" data-testid="photo-modal-image">
          </template>
        </div>
        <template x-if="state === 'ready'">
          <a class="nav-btn lc-download" :href="pick.active.webpUrl" :download="fileName()" target="_blank" rel="noopener noreferrer"
             @click="download($event)" data-testid="photo-download">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
            <span>Download original</span>
          </a>
        </template>
      </div>
    </template>
  </div>
</dialog>
