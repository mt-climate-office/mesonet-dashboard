<!-- The station search (ui/picker/stationSearch.ts), in the picker (partials/picker.html) and the
     no-station landing (partials/landing.html); the host component gives `choose(id)`,
     `searchPlaceholder()` and `searchList(open)`. Stations, and places while typing; the "Near me" chip
     inside the field. Below it Near me's results (the chip closes the search list; close() is the
     combobox's), or a picked place's stations, headed by the place ("Gallatin County", "Near Bozeman"). -->
<div class="ctl-combobox picker-search" data-testid="picker-search"
     x-data="combobox({ items: () => items(), value: () => $store.station.id, onSelect: (id) => pick(id), label: 'Search stations and places', sectionLimits: searchLimits })"
     x-effect="searchList(open)" @focusout="onFocusOut($event)">
  <label class="ctl-label sr-only" :id="ids.label" :for="ids.input" x-text="label"></label>
  <div class="ctl-combobox-field">
    <svg class="picker-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input x-ref="input" class="ctl-input" type="text" inputmode="search" role="combobox" enterkeyhint="search"
           autocomplete="off" spellcheck="false" aria-autocomplete="list" data-autofocus
           :id="ids.input" :placeholder="searchPlaceholder()" :aria-expanded="open"
           :aria-controls="ids.listbox" :aria-activedescendant="activeId()"
           :value="query" @input="onInput($event)"
           @keydown="onKeydown($event)" @click="toggle()">
    <button type="button" class="ctl-clear" x-show="hasText()"
            :aria-label="'Clear ' + label" @click="clear()">&times;</button>
    <button type="button" class="picker-near" x-show="geoSupported" @click="close(); locate()"
            :disabled="near.status === 'locating'" data-testid="near-me"
            aria-label="Near me: list the closest stations (uses your location once, in this browser)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      <span>Near me</span>
    </button>
  </div>
  <div class="ctl-combobox-popup" x-show="open">
    <div role="listbox" class="ctl-combobox-list" :id="ids.listbox"
         :aria-labelledby="ids.label" x-show="result.total > 0">
      <template x-for="group in result.groups" :key="group.name ?? ''">
        <ul :role="group.name ? 'group' : 'presentation'"
            :aria-labelledby="group.name ? groupId(group.name) : null">
          <li role="presentation" class="ctl-combobox-group" x-show="group.name"
              :id="group.name ? groupId(group.name) : null" x-text="group.name"></li>
          <template x-for="item in group.items" :key="item.id">
            <li role="option" class="ctl-option" :id="optionId(item.id)"
                :aria-selected="isActive(item.id)" :class="{ 'is-current': isCurrent(item.id) }"
                @mousedown.prevent @click="select(item.id)">
              <span x-text="item.label"></span>
              <span class="ctl-option-meta" x-text="item.meta ?? item.id"></span>
            </li>
          </template>
        </ul>
      </template>
    </div>
    <p class="ctl-combobox-note" x-show="note()" x-text="note()"></p>
  </div>
  <div role="status" class="sr-only" x-text="status()"></div>
</div>

<section class="picker-group" x-id="['near-title']" :aria-labelledby="$id('near-title')" x-show="near.status !== 'idle'" data-testid="near-results">
  <h3 class="picker-group-title" :id="$id('near-title')" x-text="near.title"></h3>
  <p class="picker-note" role="status" x-show="near.status === 'locating'">Finding your location…</p>
  <p class="picker-note" role="status" x-show="near.status === 'finding'">Finding stations…</p>
  <p class="picker-note" role="status" x-show="near.status === 'denied'" data-testid="near-denied">Location access is off for this site. Search by name or pick a station on the map.</p>
  <p class="picker-note" role="status" x-show="near.status === 'error'">Your location could not be found. Search by name or pick a station on the map.</p>
  <ul class="picker-list" x-show="near.status === 'ready'" data-testid="near-list">
    <template x-for="r in near.rows" :key="r.station">
      <li><button type="button" class="picker-row" @click="choose(r.station)" :aria-current="r.station === $store.station.id ? 'true' : null">
        <span class="picker-row-name" x-text="r.name"></span><span class="picker-row-meta" x-text="r.dist"></span>
      </button></li>
    </template>
  </ul>
</section>
