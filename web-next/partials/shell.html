<!-- Page shell: skip link, kit navbar, notice banners, the three tab panels,
     footer, and the Help and outage dialogs. Tab content comes from
     partials/<tab>/index.html. -->
<a class="mco-skip-link" href="#main">Skip to main content</a>

<header class="mco-navbar" id="navbar">
  <a href="https://climate.umt.edu" target="_blank" rel="noopener noreferrer"
     class="logo-link" aria-label="Montana Climate Office">
    <img class="logo-img" src="/mco-logo.png" alt="" width="40" height="40">
  </a>
  <div class="nav-divider" aria-hidden="true"></div>
  <div class="brand">
    <h1 class="brand-title">Mesonet Dashboard</h1>
    <span class="brand-subtitle">A service of the Montana Climate Office.</span>
  </div>

  <!-- Tabs are links: #hash routing works without JS; tabBar sets aria-current. -->
  <nav class="controls" aria-label="Dashboard sections" x-data="tabBar">
    <a class="nav-btn" href="#latest" :aria-current="current('latest')" data-testid="tab-latest">Latest Data</a>
    <a class="nav-btn" href="#ag" :aria-current="current('ag')" data-testid="tab-ag">Ag Tools</a>
    <a class="nav-btn" href="#downloader" :aria-current="current('downloader')" data-testid="tab-downloader">Data Downloader</a>
  </nav>

  <div class="nav-meta" x-data="navMeta">
    <a class="nav-btn" href="https://airtable.com/appUacO5Pq7wZYoJ3/pagqtNp2dSSjhkUkN"
       target="_blank" rel="noopener noreferrer" aria-label="Send feedback (opens in a new tab)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="btn-label">Feedback</span>
    </a>
    <button type="button" class="nav-btn" id="btn-share" aria-label="Copy a link to this view" @click="share()" data-testid="btn-share">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/></svg>
      <span class="btn-label">Share</span>
    </button>
    <button type="button" class="nav-btn icon-only" id="btn-theme" :aria-label="themeLabel" :title="themeLabel" @click="cycleTheme()" data-testid="btn-theme">
      <svg x-show="themeIcon === 'sun'" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg x-show="themeIcon === 'contrast'" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
      <svg x-show="themeIcon === 'moon'" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
    <button type="button" class="nav-btn mco-btn-info" id="btn-help" aria-label="About this dashboard" aria-haspopup="dialog" data-testid="btn-help">?</button>
  </div>
</header>

<main id="main" tabindex="-1">
  <!-- Dismissible notices (legacy ?state= links, #satellite): ui/shell/globalNotices.ts. -->
  <section class="notice-stack" aria-label="Notices" x-data="globalNotices" x-show="notices.length" x-cloak data-testid="notices">
    <template x-for="n in notices" :key="n.id">
      <div class="notice-banner" :data-testid="'notice-' + n.id">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <p><span x-text="n.text"></span> <a :href="n.href" target="_blank" rel="noopener noreferrer"><span x-text="n.linkText"></span><span class="sr-only"> (opens in a new tab)</span></a></p>
        <button type="button" class="modal-close" aria-label="Dismiss notice" @click="dismiss(n.id)">×</button>
      </div>
    </template>
  </section>
  <section id="tab-latest" class="tab-panel" aria-label="Latest Data" x-data x-show="$store.url.tab === 'latest'" x-cloak>
    <!-- @include partials/latest/index.html -->
  </section>
  <section id="tab-ag" class="tab-panel" aria-label="Ag Tools" x-data x-show="$store.url.tab === 'ag'" x-cloak>
    <!-- @include partials/ag/index.html -->
  </section>
  <section id="tab-downloader" class="tab-panel" aria-label="Data Downloader" x-data x-show="$store.url.tab === 'downloader'" x-cloak>
    <!-- @include partials/downloader/index.html -->
  </section>
</main>

<footer class="app-footer">
  <p>Data from the <a href="https://climate.umt.edu/mesonet/" target="_blank" rel="noopener noreferrer">Montana Mesonet</a>,
     quality-controlled and served by the <a href="https://mesonet2.climate.umt.edu/api/v2/docs" target="_blank" rel="noopener noreferrer">Mesonet API</a>.</p>
  <p>Montana Climate Office · <a href="https://climate.umt.edu" target="_blank" rel="noopener noreferrer">climate.umt.edu</a></p>
</footer>
