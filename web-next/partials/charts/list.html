<!-- Charts list (x-data="variableList", ui/charts/variableList.ts): a search field that filters the
     rows, then the station's variables by group (Weather · Rain and evaporation · Soil · …), each row
     a link to its page: plain name over a sub-label, the current value, a 48 h sparkline. Then Ag
     tools (#charts-ag-tools; a bare legacy #ag link scrolls here) and More (Compare variables).
     A row's name carries [data-vt-source]: it morphs into the page heading. -->
<div class="charts-list" x-data="variableList" data-testid="charts-list">
  <div class="dash-section-head">
    <h2 class="dash-section-title" id="charts-list-title" tabindex="-1">Charts</h2>
  </div>

  <template x-if="state === 'none'">
    <div class="dash-card" role="status"><p>Choose a station to see its charts.</p></div>
  </template>
  <template x-if="state === 'error'">
    <div class="dash-card"><!-- @include partials/load-error.html --></div>
  </template>
  <!-- About the list's final height (a search pill, then group cards of row-sized lines), so it does not jump as it fills. -->
  <template x-if="state === 'loading'">
    <div class="charts-ready" aria-busy="true">
      <p class="sr-only" role="status">Loading variables…</p>
      <span class="dash-skel charts-skel-search" aria-hidden="true"></span>
      <div class="charts-groups" aria-hidden="true">
        <template x-for="(n, g) in [8, 3, 3, 6]" :key="g">
          <div class="dash-card charts-group">
            <span class="dash-skel charts-skel-title"></span>
            <template x-for="i in n" :key="i"><span class="dash-skel dash-skel--line charts-skel-row"></span></template>
          </div>
        </template>
      </div>
    </div>
  </template>

  <template x-if="state === 'ready'">
    <div class="charts-ready">
      <label class="charts-search" data-testid="charts-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <span class="sr-only">Find a chart</span>
        <input type="search" placeholder="Find a chart" autocomplete="off" spellcheck="false" x-model="query" aria-controls="charts-groups">
      </label>
      <p class="sr-only" role="status" x-text="noMatch() ? 'No charts match.' : ''"></p>

      <div class="charts-groups" id="charts-groups">
        <template x-for="g in groups" :key="g.group">
          <section class="dash-card charts-group" :aria-label="g.group" x-show="filter(g.group, g.rows).length">
            <h3 class="charts-group-title" x-text="g.group"></h3>
            <ul class="charts-rows">
              <template x-for="r in filter(g.group, g.rows)" :key="r.id">
                <li>
                  <a class="charts-row" :href="href(r.id)" @click="open($event, r.id)" :data-testid="'var-' + r.id">
                    <span class="charts-row-name"><span data-vt-source x-text="r.name"></span><span class="charts-row-sub" x-show="r.note" x-text="r.note"></span></span>
                    <span class="charts-row-value" x-text="r.value"></span>
                    <span class="dash-spark charts-row-spark" aria-hidden="true">
                      <template x-if="r.spark"><svg :view-box.camel="r.spark.viewBox" preserveAspectRatio="none" focusable="false" :class="'is-' + r.spark.kind"><path :d="r.spark.d" vector-effect="non-scaling-stroke"/></svg></template>
                      <template x-if="!r.spark && sparkLoading"><span class="dash-skel dash-skel--spark"></span></template>
                    </span>
                    <span class="sr-only" x-text="r.sparkLabel"></span>
                  </a>
                </li>
              </template>
            </ul>
          </section>
        </template>

        <section class="dash-card charts-group" id="charts-ag-tools" aria-labelledby="charts-ag-tools-title" data-testid="charts-ag-tools" x-show="agTools().length">
          <h3 class="charts-group-title" id="charts-ag-tools-title">Ag tools</h3>
          <ul class="charts-rows">
            <template x-for="t in agTools()" :key="t.id">
              <li>
                <a class="charts-row charts-row--tool" :href="href(t.id)" @click="open($event, t.id)" :data-testid="'ag-tool-' + t.id">
                  <span class="charts-row-name"><span data-vt-source x-text="t.name"></span><span class="charts-row-sub" x-text="t.note"></span></span>
                </a>
              </li>
            </template>
          </ul>
        </section>

        <section class="dash-card charts-group" aria-labelledby="charts-more-title" x-show="showCompare()">
          <h3 class="charts-group-title" id="charts-more-title">More</h3>
          <ul class="charts-rows">
            <li>
              <a class="charts-row charts-row--tool" :href="compareHref()" @click="openCompare($event)" data-testid="charts-compare-link">
                <span class="charts-row-name"><span>Compare variables</span><span class="charts-row-sub">Stack several on one time axis</span></span>
              </a>
            </li>
          </ul>
        </section>
      </div>
      <p class="dash-card charts-nomatch" x-show="noMatch()" aria-hidden="true">No charts match “<span x-text="query.trim()"></span>”.</p>
    </div>
  </template>
</div>
