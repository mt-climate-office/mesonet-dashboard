<!-- Variable page (x-data="variablePage", ui/charts/variablePage.ts; DESIGN.md "Charts"):
     back (to the list) · title (the shared-element target a tapped tile or list row morphs into) · ⋯
     menu (Download data, Show as table / chart, Custom dates…, Share this chart, Previous / Next);
     "value now · range"; the chart, or its table with tbl=1 (All years: partials/charts/history.html);
     range chips; the Interval row; the stats card. A sideways swipe on touch walks the list. -->
<div class="var-page chart-page" x-data="variablePage" data-testid="variable-page">
  <template x-if="state === 'loading'">
    <div aria-busy="true"><p class="sr-only" role="status">Loading…</p><span class="dash-skel dash-skel--line" style="width: 40%" aria-hidden="true"></span></div>
  </template>
  <template x-if="state === 'unknown'">
    <div>
      <a class="dash-link var-back" :href="listHref()" @click="toList($event)">‹ All variables</a>
      <div class="dash-card" role="status"><p>This station does not report that variable. Pick another from the list.</p></div>
    </div>
  </template>

  <!-- Keyed by the variable: prev/next mounts a fresh body (chart label, history, table page). -->
  <template x-for="variable in (state === 'ready' ? [variable] : [])" :key="variable.id">
    <div class="chart-body">
      <div class="chart-head">
        <a class="dash-icon-btn var-back" :href="listHref()" @click="toList($event)" aria-label="All variables" data-testid="var-back">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </a>
        <h2 class="chart-title" id="var-title" tabindex="-1" data-vt-target x-text="title()" data-testid="variable-title"></h2>
        <div class="dash-menu" x-data="menu" data-testid="var-menu">
          <button type="button" class="dash-icon-btn" data-menu-button aria-expanded="false" aria-label="More for this chart" data-testid="var-menu-button">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </button>
          <div class="dash-menu-panel" id="var-menu" role="menu" aria-label="More for this chart" hidden>
            <button type="button" class="dash-menu-item" role="menuitem" aria-haspopup="dialog" @click="download()" data-testid="var-menu-download">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>
              Download data
            </button>
            <button type="button" class="dash-menu-item" role="menuitem" @click="toggleTable()" data-testid="var-menu-table">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M3 5h18v14H3zM3 10h18M3 15h18M9 5v14"/></svg>
              <span x-text="tableMode() ? 'Show as chart' : 'Show as table'"></span>
            </button>
            <button type="button" class="dash-menu-item" role="menuitem" aria-haspopup="dialog" @click="openDates()" data-testid="var-menu-dates">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg>
              Custom dates…
            </button>
            <button type="button" class="dash-menu-item" role="menuitem" @click="share()" data-testid="var-menu-share">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/></svg>
              Share this chart
            </button>
            <template x-if="near.prev || near.next"><hr class="dash-menu-sep"></template>
            <template x-if="near.prev">
              <button type="button" class="dash-menu-item" role="menuitem" @click="step(-1)" data-testid="var-prev">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
                <span x-text="'Previous: ' + nameOf(near.prev)"></span>
              </button>
            </template>
            <template x-if="near.next">
              <button type="button" class="dash-menu-item" role="menuitem" @click="step(1)" data-testid="var-next">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
                <span x-text="'Next: ' + nameOf(near.next)"></span>
              </button>
            </template>
          </div>
        </div>
      </div>
      <p class="chart-sub" x-text="subline()" data-testid="variable-sub"></p>

      <template x-if="!all() && !tableMode()">
        <section class="dash-card chart-card" aria-label="Chart">
          <!-- The chart stays laid out under the loading/empty overlay, so ECharts always starts at its real size. -->
          <div class="var-canvas">
            <div class="var-status" x-show="status().kind !== 'ready'">
              <template x-if="status().kind === 'loading'">
                <div><p class="sr-only" role="status">Loading the chart…</p><span class="dash-skel dash-skel--chart var-skel" aria-hidden="true"></span></div>
              </template>
              <template x-if="status().kind === 'empty'">
                <p class="charts-empty" role="status" x-text="status().title"></p>
              </template>
            </div>
            <div class="chart var-chart" :aria-hidden="status().kind !== 'ready'" data-testid="variable-chart"
                 x-data="chart({ builder: variableChart, table: variableTable, label: title() + ' chart', model: () => model(), range: () => viewRange() })"></div>
          </div>
        </section>
      </template>
      <template x-if="!all() && tableMode()">
        <section class="dash-card chart-card var-table" aria-label="Table" x-data="chartTable({ table: () => table() })" data-testid="variable-table">
          <!-- @include partials/charts/table.html -->
        </section>
      </template>
      <template x-if="all()">
        <section class="dash-card chart-card" aria-label="All years">
          <!-- @include partials/charts/history.html -->
        </section>
      </template>

      <div class="chart-chips" role="group" aria-label="Range" data-no-swipe data-testid="range-chips">
        <template x-for="c in rangeChips" :key="c.id">
          <button type="button" class="dash-chip" :aria-pressed="range() === c.id" @click="setRange(c.id)" :data-testid="'range-' + c.id" x-text="c.label"></button>
        </template>
      </div>
      <div class="chart-interval" role="group" aria-labelledby="var-interval-label" data-no-swipe data-testid="interval-chips">
        <span class="chart-interval-label" id="var-interval-label">Interval</span>
        <template x-for="c in intervals()" :key="c.id">
          <button type="button" class="dash-chip dash-chip--quiet" :aria-pressed="c.pressed" :disabled="c.disabled" :title="c.reason || null"
                  @click="setInterval(c)" :data-testid="'interval-' + c.id" x-text="c.label"></button>
        </template>
      </div>

      <template x-if="!all()">
        <section class="dash-card chart-stats" aria-label="Summary" x-show="status().kind === 'ready'" data-testid="variable-stats">
          <span class="dash-skel dash-skel--line" style="width: 50%" x-show="!settled()" aria-hidden="true"></span>
          <template x-for="row in stats()" :key="row.label">
            <dl class="chart-stat-row">
              <template x-if="row.label"><div class="chart-stat chart-stat-depth"><dt class="sr-only">Sensor</dt><dd x-text="row.label"></dd></div></template>
              <template x-for="it in row.items" :key="it.label">
                <div class="chart-stat"><dt x-text="it.label"></dt><dd x-text="it.value"></dd></div>
              </template>
            </dl>
          </template>
        </section>
      </template>
    </div>
  </template>
</div>
