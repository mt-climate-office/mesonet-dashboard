<!-- Compare (cmp=1; legacy #latest links land here; "Compare variables" in the list): back · title,
     the stacked station plot, one panel per variable (x-data="compare", ui/charts/compare.ts) and its
     options (x-data="compareControls", ui/charts/compareControls.ts) in a disclosure (its chevron turns
     when open): beside the plot and open on desktop, above it and closed otherwise. Flat surfaces, as
     the chart pages. -->
<div class="cmp" data-testid="compare">
  <div class="chart-head">
    <a class="dash-icon-btn var-back" :href="listHref()" @click="toList($event)" aria-label="All variables" data-testid="cmp-back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h2 class="chart-title" id="charts-compare-title" tabindex="-1">Compare variables</h2>
  </div>
  <p class="chart-sub">Several variables stacked on one time axis.</p>

  <template x-if="!compareReady()">
    <div class="cmp-layout" aria-busy="true"><p class="sr-only" role="status">Loading…</p><span class="dash-skel cmp-skel" aria-hidden="true"></span></div>
  </template>
  <template x-if="compareReady()">
  <div class="cmp-layout">
    <details class="dash-card cmp-options" x-data="compareControls" data-testid="compare-options">
      <summary class="cmp-summary">
        Options
        <svg class="cmp-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </summary>
      <div class="cmp-group">
        <fieldset class="ctl-fieldset" data-testid="date-range"
                  x-data="dateRange({ value: () => dates(), onChange: (r) => setDates(r), min: () => installed(), max: () => dateMax(), label: 'Date range' })">
          <legend class="ctl-legend" x-text="label"></legend>
          <div class="ctl-row">
            <div class="ctl-field">
              <label class="ctl-label" :for="ids.start">Start</label>
              <input type="date" class="ctl-input" :id="ids.start" :min="min()" :max="max()" :value="start" :aria-invalid="invalid('start')" :aria-describedby="describedBy()" @change="setStart($event)">
            </div>
            <div class="ctl-field">
              <label class="ctl-label" :for="ids.end">End</label>
              <input type="date" class="ctl-input" :id="ids.end" :min="min()" :max="max()" :value="end" :aria-invalid="invalid('end')" :aria-describedby="describedBy()" @change="setEnd($event)">
            </div>
          </div>
          <p class="ctl-error" aria-live="polite" :id="ids.error" x-text="errorText()"></p>
        </fieldset>
        <button type="button" class="dash-chip" data-testid="por-button" :aria-pressed="showingPor()" :disabled="porDisabled()" @click="togglePor()">Whole record</button>
      </div>

      <div class="cmp-group">
        <span class="cmp-legend" id="cmp-interval-label">Interval</span>
        <div class="cmp-chips" role="group" aria-labelledby="cmp-interval-label" data-testid="agg-select">
          <template x-for="opt in aggOptions()" :key="opt.value">
            <button type="button" class="dash-chip dash-chip--quiet" :aria-pressed="agg() === opt.value" @click="setAgg(opt.value)" :data-testid="'cmp-agg-' + opt.value" x-text="opt.label"></button>
          </template>
        </div>
        <p class="ctl-note" x-text="loadNote()">Hourly and daily averages load faster.</p>
        <label class="ctl-check" data-testid="gridmet-switch">
          <input type="checkbox" role="switch" aria-describedby="cmp-gridmet-help" :checked="gridmet()" :disabled="gridmetDisabled()" @change="setGridmet($event)">
          <span>Show normals</span>
        </label>
        <p class="ctl-note" id="cmp-gridmet-help">1991–2020 gridMET climate normals, on daily data only.</p>
      </div>

      <div class="cmp-group" x-data="chips({ options: () => varOptions(), value: () => varValue(), onChange: (v) => setVars(v), label: 'Variables' })">
        <span class="cmp-legend" :id="ids.label" x-text="label"></span>
        <div class="cmp-chips" role="group" :aria-labelledby="ids.label" data-testid="variable-chips">
          <template x-for="opt in options()" :key="opt.value">
            <button type="button" class="dash-chip" :aria-pressed="isOn(opt.value)" @click="toggle(opt.value)" x-text="opt.label"></button>
          </template>
        </div>
        <a class="dash-link" href="https://climate.umt.edu/mesonet/variables/" target="_blank" rel="noopener noreferrer">About these variables<span class="sr-only"> (opens in a new tab)</span></a>
      </div>
    </details>

    <section class="dash-card cmp-plot" aria-label="Station timeseries" x-data="compare" data-testid="latest-timeseries">
      <div class="cmp-status" x-show="status().kind !== 'ready'" data-testid="timeseries-status">
        <template x-if="status().kind === 'loading'">
          <div><p class="sr-only" role="status">Loading station data…</p><span class="dash-skel dash-skel--chart" aria-hidden="true"></span></div>
        </template>
        <template x-if="status().kind === 'empty'">
          <div class="charts-empty">
            <p class="charts-empty-title" x-text="status().title"></p>
            <p x-show="status().hint" x-text="status().hint"></p>
          </div>
        </template>
        <template x-if="status().kind === 'error'">
          <!-- @include partials/load-error.html -->
        </template>
      </div>
      <p class="cmp-refreshing" x-show="status().kind === 'ready' && loading()" aria-hidden="true">Updating…</p>
      <div class="chart cmp-chart" :aria-hidden="status().kind !== 'ready'" :style="heightStyle()"
           x-data="chart({ builder: latestTimeseriesChart, table: latestTimeseriesTable, label: 'Station timeseries', model: () => model(), onZoom: (a, b) => onZoom(a, b), range: () => range() })"></div>
    </section>
  </div>
  </template>
</div>
